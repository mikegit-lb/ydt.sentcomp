<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10382c">
    <meta name="description" content="YDT cümle tamamlama için yöntem rehberi, 50 özgün zor soru ve kişisel ilerleme takibi.">
    <title>YDT Cümle Tamamlama | Yöntem ve 50 Soru</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="content.js" defer></script>
    <script src="questions.js?v=2" defer></script>
    <script src="app.js?v=2" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Site menüsü">
        <a class="brand" href="#method" data-view="method" aria-label="YDT Cümle Tamamlama ana sayfa">
          <span>YDT</span>
          <span>Cümle Tamamlama</span>
        </a>

        <nav class="primary-nav" aria-label="Ana bölümler">
          <button class="nav-link" type="button" data-view="method">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3.75h8l4 4V20.25H6z"/><path d="M14 3.75v4h4M9 12h6M9 15.5h6"/></svg>
            <span>Yöntem</span>
          </button>
          <button class="nav-link" type="button" data-view="practice">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4.75h10v15H5v-15h2"/><path d="M8 3.25h6v3H8zM9 11h6M9 14.5h6"/></svg>
            <span>50 Soru</span>
          </button>
          <button class="nav-link" type="button" data-view="progress">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.5 19.5V13h4v6.5zM10 19.5V8h4v11.5zM15.5 19.5V4h4v15.5z"/></svg>
            <span>İlerlemem</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section-heading">Soru setleri</div>
        <nav id="module-nav" class="module-nav" aria-label="Soru modülleri"></nav>
        <nav id="sidebar-question-grid" class="sidebar-question-grid" aria-label="Bu setteki sorular" hidden></nav>
        <div class="sidebar-footnote">
          <span class="footnote-mark" aria-hidden="true">↗</span>
          <span>Önce ilişkiyi bul.<br>Sonra seçeneği doğrula.</span>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div id="breadcrumb" class="breadcrumb">Yöntem / Çözüm sistemi</div>
          <div class="topbar-actions">
            <div id="storage-status" class="storage-status" aria-live="polite">İlerlemen bu cihazda saklanır.</div>
            <button id="mode-toggle" class="mode-toggle" type="button" hidden>Deneme modunu başlat</button>
          </div>
        </header>
        <div id="app-view" tabindex="-1"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
